name = "kajikanri"
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "kajikanri"
database_id = "3cbda999-8cec-4bf0-b2a9-163e641eb75b"

# Cada 30 min. Los avisos se deduplican por día en notification_log.
[triggers]
crons = ["*/30 * * * *"]

